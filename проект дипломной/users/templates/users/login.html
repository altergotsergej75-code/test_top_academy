<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход студента</title>
</head>
<body>

    <h1>Вход на образовательную платформу</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Войти</button>
    </form>

    <p>
        Ещё нет аккаунта?
        <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>

    <p>
        <a href="{% url 'course_list' %}">Перейти к курсам</a>
    </p>

</body>
</html>
